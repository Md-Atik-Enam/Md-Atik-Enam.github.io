<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 630" role="img" aria-labelledby="title desc">
<title id="title">Modeled contrast ratio under night and glare sensitivity inputs</title>
<desc id="desc">Log scale contrast ratio for hypothetical center HMI and HUD luminances under additive veil inputs of zero, 0.5, and 2 candela per square metre.</desc>
<rect width="1120" height="630" rx="22" fill="#fff"/>
<text x="48" y="53" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#173d37">Modeled contrast falls as an assumed glare veil increases</text>
<text x="48" y="84" font-family="Arial,sans-serif" font-size="16" fill="#56655e">Illustrative luminance model • log scale • no visibility threshold is applied</text>
<g stroke="#e1e8e4" stroke-width="1"><path d="M118 140H1030M118 220H1030M118 300H1030M118 380H1030M118 460H1030"/></g>
<g font-family="Arial,sans-serif" font-size="15" fill="#56655e"><text x="75" y="465">1</text><text x="64" y="385">10</text><text x="55" y="305">100</text><text x="55" y="225">1,000</text><text x="51" y="145">10,000</text></g>
<path d="M118 140V460H1030" fill="none" stroke="#76877f" stroke-width="2"/>
<!-- log10 scale 1 to 10000; bars encode ratios -->
<g fill="#287864">
<rect x="241" y="304" width="62" height="156" rx="7"/><rect x="389" y="307" width="62" height="153" rx="7"/><rect x="537" y="317" width="62" height="143" rx="7"/><rect x="685" y="326" width="62" height="134" rx="7"/><rect x="833" y="334" width="62" height="126" rx="7"/>
</g>
<g fill="#d35b3f">
<rect x="307" y="342" width="62" height="118" rx="7"/><rect x="455" y="358" width="62" height="102" rx="7"/><rect x="603" y="382" width="62" height="78" rx="7"/><rect x="751" y="399" width="62" height="61" rx="7"/><rect x="899" y="409" width="62" height="51" rx="7"/>
</g>
<g font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#25332e" text-anchor="middle">
<text x="272" y="293">80</text><text x="420" y="296">76.2</text><text x="568" y="306">53.7</text><text x="716" y="315">27.3</text><text x="864" y="323">14.2</text>
<text x="338" y="331">300</text><text x="486" y="347">200.3</text><text x="634" y="371">50.8</text><text x="782" y="388">15.2</text><text x="930" y="398">6.9</text>
</g>
<g font-family="Arial,sans-serif" font-size="15" fill="#56655e" text-anchor="middle">
<text x="305" y="491">0 (clear)</text><text x="453" y="491">0.05</text><text x="601" y="491">0.5</text><text x="749" y="491">2.0</text><text x="897" y="491">5.0</text>
</g>
<text x="420" y="523" font-family="Arial,sans-serif" font-size="15" fill="#56655e">Assumed in-eye veiling luminance (cd/m²)</text>
<rect x="150" y="553" width="18" height="18" rx="3" fill="#287864"/><text x="177" y="568" font-family="Arial,sans-serif" font-size="15" fill="#25332e">Center HMI (80 / 1 cd/m² text/background)</text>
<rect x="570" y="553" width="18" height="18" rx="3" fill="#d35b3f"/><text x="597" y="568" font-family="Arial,sans-serif" font-size="15" fill="#25332e">HUD (30 / 0.1 cd/m² text/background)</text>
<text x="48" y="606" font-family="Arial,sans-serif" font-size="13" fill="#795119">Veil values are hypothetical sensitivity inputs, not measured high-beam exposure or tested passenger visibility.</text>
</svg>