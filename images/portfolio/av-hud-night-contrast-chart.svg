<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 630" role="img" aria-labelledby="title desc">
<title id="title">Modeled contrast ratio under night and glare sensitivity inputs</title>
<desc id="desc">Log scale contrast ratios for hypothetical center HMI and HUD luminances under additive veil inputs from zero to five candela per square metre.</desc>
<rect width="1120" height="630" rx="22" fill="#fff"/>
<text x="48" y="53" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#173d37">Modeled contrast falls as an assumed glare veil increases</text>
<text x="48" y="84" font-family="Arial,sans-serif" font-size="16" fill="#56655e">Illustrative luminance model • log scale • no visibility threshold is applied</text>
<g stroke="#e1e8e4" stroke-width="1"><path d="M118 140H1030"/><path d="M118 220H1030"/><path d="M118 300H1030"/><path d="M118 380H1030"/><path d="M118 460H1030"/></g>
<g font-family="Arial,sans-serif" font-size="15" fill="#56655e"><text x="75" y="465">1</text><text x="64" y="385">10</text><text x="55" y="305">100</text><text x="55" y="225">1,000</text><text x="51" y="145">10,000</text></g>
<path d="M118 140V460H1030" fill="none" stroke="#76877f" stroke-width="2"/>
<!-- log scale y = 460 - 80 * log10(ratio); paired bars -->
<g fill="#287864"><rect x="236" y="307" width="58" height="153" rx="7"/><rect x="382" y="307" width="58" height="153" rx="7"/><rect x="528" y="321" width="58" height="139" rx="7"/><rect x="674" y="345" width="58" height="115" rx="7"/><rect x="820" y="368" width="58" height="92" rx="7"/></g>
<g fill="#d35b3f"><rect x="298" y="262" width="58" height="198" rx="7"/><rect x="444" y="276" width="58" height="184" rx="7"/><rect x="590" y="321" width="58" height="139" rx="7"/><rect x="736" y="366" width="58" height="94" rx="7"/><rect x="882" y="393" width="58" height="67" rx="7"/></g>
<g font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#25332e" text-anchor="middle">
<text x="265" y="298">80</text><text x="411" y="298">76.2</text><text x="557" y="312">53.7</text><text x="703" y="336">27.3</text><text x="849" y="359">14.2</text>
<text x="327" y="253">300</text><text x="473" y="267">200.3</text><text x="619" y="312">50.8</text><text x="765" y="357">15.2</text><text x="911" y="384">6.9</text>
</g>
<g font-family="Arial,sans-serif" font-size="15" fill="#56655e" text-anchor="middle"><text x="296" y="491">0 (clear)</text><text x="442" y="491">0.05</text><text x="588" y="491">0.5</text><text x="734" y="491">2.0</text><text x="880" y="491">5.0</text></g>
<text x="420" y="523" font-family="Arial,sans-serif" font-size="15" fill="#56655e">Assumed in-eye veiling luminance (cd/m²)</text>
<rect x="150" y="553" width="18" height="18" rx="3" fill="#287864"/><text x="177" y="568" font-family="Arial,sans-serif" font-size="15" fill="#25332e">Center HMI (80 / 1 cd/m² text/background)</text>
<rect x="570" y="553" width="18" height="18" rx="3" fill="#d35b3f"/><text x="597" y="568" font-family="Arial,sans-serif" font-size="15" fill="#25332e">HUD (30 / 0.1 cd/m² text/background)</text>
<text x="48" y="606" font-family="Arial,sans-serif" font-size="13" fill="#795119">Veil inputs are hypothetical, not measured high-beam exposure or tested passenger visibility.</text>
</svg>