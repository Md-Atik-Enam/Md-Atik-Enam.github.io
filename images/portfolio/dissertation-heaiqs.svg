<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">HEAIQS interaction quality framework</title>
<desc id="desc">Four connected dimensions around a central human-AI interaction.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7fbfa"/><stop offset="1" stop-color="#edf3f8"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#233647" flood-opacity=".12"/></filter>
</defs>
<rect width="1200" height="760" rx="38" fill="url(#bg)"/>
<text x="70" y="82" fill="#17243a" font-family="Georgia,serif" font-size="38" font-weight="700">Human-AI Interaction Quality</text>
<text x="70" y="122" fill="#566575" font-family="Arial,sans-serif" font-size="21">A four-part measurement profile</text>
<g stroke="#b7c7cd" stroke-width="4" fill="none">
  <path d="M600 376L330 255M600 376L870 255M600 376L330 545M600 376L870 545"/>
</g>
<g filter="url(#shadow)">
  <circle cx="600" cy="376" r="112" fill="#17243a"/>
  <circle cx="600" cy="376" r="83" fill="#0b6b62"/>
  <text x="600" y="364" text-anchor="middle" fill="white" font-family="Georgia,serif" font-size="28" font-weight="700">Passenger</text>
  <text x="600" y="402" text-anchor="middle" fill="#d9f2ed" font-family="Arial,sans-serif" font-size="22">AI interaction</text>
</g>
<g font-family="Arial,sans-serif">
  <g transform="translate(125 165)"><rect width="330" height="176" rx="24" fill="white" stroke="#cae2dc"/><circle cx="52" cy="54" r="24" fill="#dff2ed"/><text x="52" y="62" text-anchor="middle" fill="#0b6b62" font-size="22" font-weight="700">1</text><text x="92" y="57" fill="#17243a" font-size="23" font-weight="700">Socio-emotional agency</text><text x="32" y="106" fill="#566575" font-size="18">Social understanding and</text><text x="32" y="134" fill="#566575" font-size="18">meaningful response</text></g>
  <g transform="translate(745 165)"><rect width="330" height="176" rx="24" fill="white" stroke="#d5e0eb"/><circle cx="52" cy="54" r="24" fill="#e5edf5"/><text x="52" y="62" text-anchor="middle" fill="#355d83" font-size="22" font-weight="700">2</text><text x="92" y="57" fill="#17243a" font-size="23" font-weight="700">Personalization</text><text x="32" y="106" fill="#566575" font-size="18">Individual fit and</text><text x="32" y="134" fill="#566575" font-size="18">adaptation</text></g>
  <g transform="translate(125 455)"><rect width="330" height="176" rx="24" fill="white" stroke="#eadbbf"/><circle cx="52" cy="54" r="24" fill="#f8edd7"/><text x="52" y="62" text-anchor="middle" fill="#aa7b2f" font-size="22" font-weight="700">3</text><text x="92" y="57" fill="#17243a" font-size="23" font-weight="700">Situated presence</text><text x="32" y="106" fill="#566575" font-size="18">Awareness of the shared</text><text x="32" y="134" fill="#566575" font-size="18">vehicle setting</text></g>
  <g transform="translate(745 455)"><rect width="330" height="176" rx="24" fill="white" stroke="#e6cfd7"/><circle cx="52" cy="54" r="24" fill="#f5e7ec"/><text x="52" y="62" text-anchor="middle" fill="#9a4f66" font-size="22" font-weight="700">4</text><text x="92" y="57" fill="#17243a" font-size="23" font-weight="700">Communication</text><text x="32" y="106" fill="#566575" font-size="18">Clear system state, action,</text><text x="32" y="134" fill="#566575" font-size="18">and timing</text></g>
</g>
</svg>