<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Authority in an AI-assisted decision</title>
<desc id="desc">A natural-language request becomes a decision space and final route through upstream and downstream authority.</desc>
<defs><linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#faf7ef"/><stop offset="1" stop-color="#edf6f3"/></linearGradient><filter id="s3"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#233647" flood-opacity=".11"/></filter></defs>
<rect width="1200" height="760" rx="38" fill="url(#bg3)"/>
<text x="70" y="82" fill="#17243a" font-family="Georgia,serif" font-size="38" font-weight="700">Who Shapes the Decision?</text>
<text x="70" y="122" fill="#566575" font-family="Arial,sans-serif" font-size="21">Authority operates before and after options are created</text>
<g filter="url(#s3)" font-family="Arial,sans-serif">
 <g transform="translate(70 230)"><rect width="270" height="250" rx="26" fill="white" stroke="#d6e0e5"/><circle cx="68" cy="68" r="31" fill="#e5edf5"/><path d="M55 68h26M68 55v26" stroke="#355d83" stroke-width="5" stroke-linecap="round"/><text x="38" y="135" fill="#17243a" font-size="25" font-weight="700">Human intent</text><text x="38" y="176" fill="#566575" font-size="19">Natural-language</text><text x="38" y="204" fill="#566575" font-size="19">request</text></g>
 <g transform="translate(465 190)"><rect width="270" height="330" rx="26" fill="white" stroke="#c7dfd9"/><text x="38" y="56" fill="#0b6b62" font-size="17" font-weight="700">UPSTREAM AUTHORITY</text><text x="38" y="103" fill="#17243a" font-size="25" font-weight="700">Decision space</text><g fill="#dff2ed"><rect x="38" y="138" width="194" height="36" rx="18"/><rect x="38" y="191" width="158" height="36" rx="18"/><rect x="38" y="244" width="214" height="36" rx="18"/></g><g fill="#0b6b62" font-size="17"><text x="58" y="162">Time</text><text x="58" y="215">Safety</text><text x="58" y="268">Preferences</text></g></g>
 <g transform="translate(860 230)"><rect width="270" height="250" rx="26" fill="white" stroke="#e7d9bd"/><text x="38" y="56" fill="#aa7b2f" font-size="17" font-weight="700">DOWNSTREAM AUTHORITY</text><text x="38" y="103" fill="#17243a" font-size="25" font-weight="700">Route choice</text><path d="M55 158c48-42 84 42 132 0s54 22 54 22" fill="none" stroke="#aa7b2f" stroke-width="7" stroke-linecap="round"/><circle cx="55" cy="158" r="10" fill="#17243a"/><circle cx="241" cy="180" r="10" fill="#0b6b62"/></g>
</g>
<g stroke="#9fb1bd" stroke-width="5" fill="none"><path d="M340 355H465"/><path d="M735 355H860"/></g>
<g fill="#9fb1bd"><path d="M465 355l-18-11v22z"/><path d="M860 355l-18-11v22z"/></g>
<rect x="225" y="580" width="750" height="92" rx="22" fill="#17243a"/>
<text x="600" y="616" text-anchor="middle" fill="white" font-family="Georgia,serif" font-size="23" font-weight="700">Meaningful human agency</text>
<text x="600" y="648" text-anchor="middle" fill="#dce8ef" font-family="Arial,sans-serif" font-size="18">Inspect, challenge, and revise the AI's earlier influence</text>
</svg>